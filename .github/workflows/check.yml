name: Check app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile app and agent modules
        run: python -m compileall -q app.py worker.py hana_ai
      - name: Test agents, action controls and dashboard
        run: python -m pytest -q
