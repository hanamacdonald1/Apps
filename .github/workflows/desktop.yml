name: Build desktop installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install desktop build dependencies
        run: python -m pip install -r requirements-desktop.txt pyinstaller pillow pytest
      - name: Test desktop and agent behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_accounts.py tests/test_agents.py tests/test_income.py tests/test_sources.py tests/test_desktop.py
      - name: Create app icon
        run: python packaging/make_icon.py
      - name: Bundle native desktop application
        run: python -m PyInstaller --noconfirm packaging/HanaAI.spec
      - name: Smoke test packaged executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HANA_DATA_DIR: ${{ runner.temp }}/hana-packaged-smoke
        run: |
          $process = Start-Process -FilePath '.\dist\HanaAI\HanaAI.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Packaged app did not exit smoke test' }
          if ($process.ExitCode -ne 0) { throw "Packaged app failed: $($process.ExitCode)" }
      - name: Find or install Inno Setup
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler unavailable' }
          & $compiler packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HanaAI-Windows-Installer
          path: installer-output/HanaAI-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable desktop app
        uses: actions/upload-artifact@v4
        with:
          name: HanaAI-Windows-Portable
          path: dist/HanaAI/
          if-no-files-found: error
          retention-days: 30
